services:
  - type: web
    name: koda-music-studio
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: koda-persistent-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: KODA_DATA_DIR
        value: /var/data/data
      - key: KODA_UPLOADS_DIR
        value: /var/data/uploads
      - key: KODA_ADMIN_PASSWORD
        sync: false
      - key: KODA_SESSION_SECRET
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
